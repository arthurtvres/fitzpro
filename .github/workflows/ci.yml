name: CI

# Em todo push/PR pra main: roda o teste de isolamento do backend, builda o
# front e builda a imagem Docker — pega quebra de dependência, de build e de
# Dockerfile antes de chegar em produção. Não publica nada ainda (sem
# registro/host decidido); isso entra quando o deploy automático for montado.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r backend/requirements.txt
        working-directory: backend

      - name: Suíte de isolamento de tenant
        # O script aponta pro próprio SQLite temporário e sai com código 1 se
        # alguma asserção falhar — não precisa de pytest nem de setup extra.
        # PYTHONPATH=. é necessário: o script importa `app.*`, e sem a raiz
        # do backend no path (rodando como arquivo solto, não como módulo)
        # o import falha antes de qualquer teste rodar.
        run: python tests/teste_isolamento.py
        working-directory: backend
        env:
          PYTHONPATH: .

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      - name: Build de produção
        run: npm run build
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem (produção)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          target: backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
